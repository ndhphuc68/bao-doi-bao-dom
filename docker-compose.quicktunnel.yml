# Quick Tunnel (URL *.trycloudflare.com, đổi mỗi lần chạy — không cần domain).
# Chạy prod: ./scripts/public.sh run hoặc ./scripts/quicktunnel-up.sh
# Chạy dev: docker compose -f docker-compose.yml -f docker-compose.quicktunnel.yml up
#
# Logs sẽ có 3 URL riêng:
#   cloudflared-quick-backend → BE/API
#   cloudflared-quick-user    → FE user
#   cloudflared-quick-admin   → FE admin
# public.sh chỉ chạy 3 tunnel, không build/recreate BE/FE.
# Nếu cần đổi API base cho FE, đặt trong .env rồi restart FE bằng scripts/prod.sh hoặc scripts/local-links.sh.
# Admin chỉ LAN: không cần biến trên — dùng http://localhost:3002 hoặc http://<LOCAL_IP>:3002.

services:
  cloudflared-quick-backend:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared-quick-user:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://frontend:3000
    depends_on:
      - frontend
    restart: unless-stopped

  cloudflared-quick-admin:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://admin-frontend:3002
    depends_on:
      - admin-frontend
    restart: unless-stopped

  frontend:
    environment:
      # Từ xa: .env → NUXT_PUBLIC_API_BASE=https://<host_trycloudflare_backend>
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://${LOCAL_IP:-localhost}:3001}

  backend:
    environment:
      CORS_REFLECT_REQUEST_ORIGIN: "true"

  admin-frontend:
    environment:
      # Từ xa: .env → ADMIN_NUXT_PUBLIC_API_BASE=https://<host_trycloudflare_backend>
      NUXT_PUBLIC_API_BASE: ${ADMIN_NUXT_PUBLIC_API_BASE:-http://${LOCAL_IP:-localhost}:3001}
